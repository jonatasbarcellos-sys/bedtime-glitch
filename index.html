<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Bedtime Glitch">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#14081f">
<link rel="manifest" href="manifest.webmanifest">
<title>Bedtime Glitch</title>
<style>
html, body, #canvas { margin: 0; padding: 0; border: 0; }
html, body { width: 100%; height: 100%; background: #14081f; overflow: hidden; overscroll-behavior: none; }
body { color: #fff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif; touch-action: none; position: fixed; inset: 0; }
* { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
#canvas { display: block; touch-action: none; outline: none; }
.layer { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #14081f; text-align: center; }
#status { z-index: 2; }
#status-splash { max-width: 40vmin; max-height: 40vmin; border-radius: 18%; margin-bottom: 4vmin; }
#status-progress { width: min(60vw, 420px); height: 14px; accent-color: #3de6ff; }
#status-text { margin-top: 12px; opacity: .8; font-size: 15px; }
#start-btn { display: none; font-weight: 800; font-size: clamp(22px, 6vmin, 38px); line-height: 1; color: #14081f; background: #ffe39e; border: 0; border-radius: 999px; padding: .7em 1.6em; box-shadow: 0 0 0 6px rgba(61,230,255,.35); cursor: pointer; font-family: inherit; }
#status-notice { display: none; background: #5b3943; border: 1px solid #9b3943; border-radius: 8px; padding: 1rem; margin: 0 2rem; line-height: 1.3; }
#rotate { z-index: 3; display: none; }
#rotate .phone { width: 64px; height: 110px; border: 6px solid #ffe39e; border-radius: 14px; animation: turn 2s ease-in-out infinite; margin-bottom: 28px; }
#rotate p { font-size: 20px; margin: 0 24px; }
@keyframes turn { 0%, 30% { transform: rotate(0); } 60%, 100% { transform: rotate(-90deg); } }
@media (orientation: portrait) and (hover: none) and (pointer: coarse) { #rotate { display: flex; } }
</style>
<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

</head>
<body>
<canvas id="canvas">Your browser does not support the canvas tag.</canvas>
<noscript>Bedtime Glitch needs JavaScript turned on.</noscript>
<div id="status" class="layer">
  <img id="status-splash" src="index.png" alt="">
  <progress id="status-progress"></progress>
  <div id="status-text">Loading…</div>
  <button id="start-btn" type="button">Tap to start</button>
  <div id="status-notice"></div>
</div>
<div id="rotate" class="layer"><div class="phone"></div><p>Turn your device sideways to play</p></div>

<script>
// Collect every AudioContext the engine creates so the first tap can unlock audio (Safari/iOS).
(function () {
  const Orig = window.AudioContext || window.webkitAudioContext;
  if (!Orig) { return; }
  const contexts = [];
  class TrackedAudioContext extends Orig {
    constructor(...args) { super(...args); contexts.push(this); }
  }
  window.AudioContext = TrackedAudioContext;
  if (window.webkitAudioContext) { window.webkitAudioContext = TrackedAudioContext; }
  window.bgUnlockAudio = function () {
    contexts.forEach((ctx) => { if (ctx.state !== 'running' && ctx.state !== 'closed') { ctx.resume().catch(() => {}); } });
  };
  ['touchend', 'pointerup', 'mousedown', 'keydown'].forEach((ev) => document.addEventListener(ev, window.bgUnlockAudio, true));
}());
// Block page zoom/scroll gestures (iOS ignores user-scalable=no for pinch).
['gesturestart', 'gesturechange', 'gestureend', 'dblclick', 'contextmenu', 'selectstart'].forEach((ev) =>
  document.addEventListener(ev, (e) => e.preventDefault(), { passive: false }));
document.addEventListener('touchmove', (e) => { if (e.cancelable) { e.preventDefault(); } }, { passive: false });
</script>
<script src="index.js"></script>
<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":28903364,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
  const status = document.getElementById('status');
  const progress = document.getElementById('status-progress');
  const text = document.getElementById('status-text');
  const startBtn = document.getElementById('start-btn');
  const notice = document.getElementById('status-notice');

  function fail(err) {
    console.error(err);
    notice.textContent = (err && err.message) ? err.message : String(err || 'Something went wrong loading the game.');
    notice.style.display = 'block';
    progress.style.display = 'none';
    text.style.display = 'none';
    startBtn.style.display = 'none';
  }

  const missing = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });
  if (missing.length !== 0) {
    fail(new Error('This browser is missing features the game needs:\n' + missing.join('\n')));
    return;
  }

  function goFullscreen() {
    const touch = window.matchMedia('(pointer: coarse)').matches;
    const standalone = window.navigator.standalone || window.matchMedia('(display-mode: fullscreen), (display-mode: standalone)').matches;
    if (!touch || standalone) { return; }
    const el = document.documentElement;
    const req = el.requestFullscreen || el.webkitRequestFullscreen;
    if (!req) { return; }
    try {
      const p = req.call(el);
      if (p && p.then) {
        p.then(() => { if (screen.orientation && screen.orientation.lock) { screen.orientation.lock('landscape').catch(() => {}); } }).catch(() => {});
      }
    } catch (e) { /* not supported (iPhone Safari) */ }
  }

  engine.startGame({
    onProgress: function (current, total) {
      if (current > 0 && total > 0) {
        progress.value = current;
        progress.max = total;
        text.textContent = 'Loading… ' + Math.round((current / total) * 100) + '%';
      } else {
        progress.removeAttribute('value');
        progress.removeAttribute('max');
      }
    },
  }).then(() => {
    progress.style.display = 'none';
    text.style.display = 'none';
    startBtn.style.display = 'block';
    status.style.background = 'rgba(20, 8, 31, 0.82)';
    const start = (e) => {
      e.preventDefault();
      if (window.bgUnlockAudio) { window.bgUnlockAudio(); }
      goFullscreen();
      status.remove();
      const canvas = document.getElementById('canvas');
      if (canvas) { canvas.focus(); }
    };
    status.addEventListener('click', start, { once: true });
  }, fail);
}());
</script>
</body>
</html>
